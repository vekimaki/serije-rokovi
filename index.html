<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Serije i rokovi – Alfa lek</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --ljub:#6a1b9a; --ljub2:#8e24aa; --tirk:#00acc1; --nar:#fb8c00;
    --zel:#2e7d32; --zel2:#43a047; --crv:#d32f2f; --poz:#f5f3fa;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--poz);color:#222}
  header{background:linear-gradient(135deg,var(--ljub),var(--ljub2));color:#fff;padding:14px 16px;
         display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
  header h1{font-size:19px;margin:0}
  #apotekaOzn{background:rgba(255,255,255,.22);padding:5px 12px;border-radius:14px;font-size:14px;cursor:pointer}
  main{max-width:520px;margin:0 auto;padding:12px}
  .kartica{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;
           box-shadow:0 2px 6px rgba(0,0,0,.08);border-top:5px solid var(--tirk)}
  .kartica.nar{border-top-color:var(--nar)}
  .kartica.lj{border-top-color:var(--ljub)}
  h2{font-size:16px;margin:0 0 10px;color:var(--ljub)}
  #kamera{width:100%;border-radius:10px;overflow:hidden;background:#000;min-height:220px}
  .red{display:flex;gap:8px;margin-top:10px}
  input,select{font-size:18px;padding:12px;border:2px solid #d6cce6;border-radius:10px;width:100%;background:#fff}
  input:focus,select:focus{outline:none;border-color:var(--tirk)}
  button{font-size:17px;font-weight:600;padding:13px 16px;border:none;border-radius:10px;cursor:pointer;color:#fff;background:var(--ljub2)}
  button:active{transform:scale(.98)}
  .zeleno{background:var(--zel2)}
  .tirk{background:var(--tirk)}
  .nard{background:var(--nar)}
  .okvir{background:#fff;color:var(--ljub2);border:2px solid var(--ljub2)}
  .puno{width:100%}
  .naziv{font-size:18px;font-weight:700}
  .sitno{color:#666;font-size:14px}
  label{display:block;font-weight:600;margin:14px 0 4px;color:#444}
  .upoz{margin-top:8px;padding:10px;border-radius:10px;font-weight:600;display:none;white-space:pre-line}
  .upoz.crveno{display:block;background:#fdecea;color:var(--crv)}
  .upoz.narand{display:block;background:#fff3e0;color:#e65100}
  .upoz.info{display:block;background:#e0f7fa;color:#006064}
  .izbor button{display:block;width:100%;margin-top:8px;text-align:left;background:#fff;color:#222;border:2px solid var(--tirk)}
  #poruka{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:12px 20px;border-radius:12px;
          color:#fff;font-weight:600;display:none;z-index:9;max-width:90%;text-align:center}
  .ucitava{opacity:.55;pointer-events:none}
  ul{list-style:none;padding:0;margin:0}
  li{padding:8px 0;border-bottom:1px solid #eee;font-size:14px}
  li b{color:var(--ljub)}
  .skriveno{display:none !important}
</style>
</head>
<body>

<header>
  <h1>📦 Serije i rokovi</h1>
  <span id="apotekaOzn" onclick="promeniApoteku()">—</span>
</header>

<main>
  <!-- Izbor apoteke (samo ako nije u linku) -->
  <section id="ekApoteka" class="kartica lj skriveno">
    <h2>Izaberi apoteku</h2>
    <select id="izborApoteke"></select>
    <button class="zeleno puno" style="margin-top:10px" onclick="sacuvajApoteku()">Potvrdi</button>
  </section>

  <!-- 1. Skeniranje -->
  <section id="ekSken" class="kartica skriveno">
    <h2>1. Skeniraj barkod</h2>
    <div id="kamera"></div>
    <div class="red">
      <input id="barkodRucno" inputmode="numeric" placeholder="ili ukucaj barkod" autocomplete="off">
      <button class="tirk" onclick="traziRucno()">Traži</button>
    </div>
    <div class="sitno" style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px">
      <span id="sifStatus">⏳ Učitavam šifarnik...</span>
      <a href="#" style="color:var(--ljub2);font-weight:600;white-space:nowrap" onclick="ucitajSifarnik(true);return false;">↻ osveži</a>
    </div>
  </section>

  <!-- 2. Artikal, rok, serija -->
  <section id="ekArtikal" class="kartica nar skriveno">
    <h2>2. Artikal</h2>
    <div id="izbor" class="izbor"></div>
    <div id="izabran">
      <div class="naziv" id="nazivA"></div>
      <div class="sitno">ID: <b id="idA"></b> · Barkod: <span id="bkA"></span></div>

      <button class="nard puno" style="margin-top:12px" onclick="slikaj()">📷 Slikaj rok i seriju</button>
      <input type="file" id="foto" accept="image/*" capture="environment" class="skriveno">
      <div id="infoSlika" class="upoz"></div>

      <label for="rok">Rok (MM/GGGG)</label>
      <input id="rok" inputmode="numeric" placeholder="npr. 0328" autocomplete="off">
      <div id="upozRok" class="upoz"></div>

      <label for="serija">Serija <span class="sitno">(sama se popunjava iz roka)</span></label>
      <input id="serija" autocomplete="off" autocapitalize="characters" placeholder="npr. MART 2027">

      <div class="red">
        <button class="okvir" onclick="nazad()">Otkaži</button>
        <button class="zeleno" style="flex:1" onclick="sacuvaj()">✔ Sačuvaj</button>
      </div>
    </div>
  </section>

  <!-- Podešavanje -->
  <section class="kartica">
    <h2>Model za čitanje roka</h2>
    <select id="model">
      <option value="gemini-2.5-flash">Obični (gemini-2.5-flash)</option>
      <option value="gemini-2.5-flash-lite">Brži (gemini-2.5-flash-lite)</option>
    </select>
  </section>

  <!-- Poslednji unosi -->
  <section class="kartica lj">
    <h2>Poslednji unosi sa ovog telefona</h2>
    <ul id="lista"><li class="sitno">Još ništa.</li></ul>
  </section>
</main>

<div id="poruka"></div>

<script>
const URL_SKRIPTE = 'https://script.google.com/macros/s/AKfycbzAfu8l60RpauzdzhOI5DLG7fOFFMyFTBkm8eo7WpN7pN_-G4Ri88b5XhWUr1rApEmrxQ/exec';
const APOTEKE = ['Zmajevo', 'Karavukovo', 'Klisa', 'Evropa', 'Detelinara', 'Ravno Selo', 'Magacin'];

let apoteka = '';
let trenutni = null;     // {id, naziv, barkod}
let skener = null;
let kameraRadi = false;
let obrada = false;      // sprečava dvostruko skeniranje
const unosi = [];

// ---------- pomoćne ----------
function $(id) { return document.getElementById(id); }
function pokazi(id, da) { $(id).classList.toggle('skriveno', !da); }

function poruka(t, boja) {
  const p = $('poruka');
  p.textContent = t;
  p.style.background = boja || 'var(--zel)';
  p.style.display = 'block';
  clearTimeout(p._t);
  p._t = setTimeout(() => { p.style.display = 'none'; }, 2800);
}

async function pozovi(podaci) {
  const r = await fetch(URL_SKRIPTE, { method: 'POST', body: JSON.stringify(podaci) });
  return await r.json();
}

function prikaziInfo(t, klasa) {
  const d = $('infoSlika');
  d.className = 'upoz ' + klasa;
  d.textContent = t;
}
function sakrijInfo() { $('infoSlika').className = 'upoz'; }

// ---------- apoteka ----------
function citajApoteku() {
  const p = new URLSearchParams(location.search).get('apoteka');
  if (p) return p;
  try { return localStorage.getItem('sr_apoteka') || ''; } catch (e) { return ''; }
}

function promeniApoteku() {
  zaustaviKameru();
  pokazi('ekSken', false);
  pokazi('ekArtikal', false);
  pokazi('ekApoteka', true);
  if (apoteka) $('izborApoteke').value = apoteka;
}

function sacuvajApoteku() {
  apoteka = $('izborApoteke').value;
  try { localStorage.setItem('sr_apoteka', apoteka); } catch (e) {}
  $('apotekaOzn').textContent = apoteka;
  pokazi('ekApoteka', false);
  nazad();
}

// ---------- kamera ----------
async function pokreniKameru() {
  obrada = false;
  if (kameraRadi) return;
  try {
    if (!skener) {
      const F = Html5QrcodeSupportedFormats;
      skener = new Html5Qrcode('kamera', {
        formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.DATA_MATRIX],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
        verbose: false
      });
    }
    await skener.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: (w, h) => ({ width: Math.max(60, Math.floor(w * 0.85)), height: Math.max(60, Math.floor(Math.min(w, h) * 0.45)) }) },
      naSken,
      () => {}
    );
    kameraRadi = true;
  } catch (e) {
    skener = null;
    $('kamera').innerHTML = '<div style="color:#fff;padding:24px;text-align:center">Kamera nije dostupna.<br>Ukucaj barkod ispod.</div>';
  }
}

async function zaustaviKameru() {
  if (skener && kameraRadi) {
    try { await skener.stop(); } catch (e) {}
  }
  kameraRadi = false;
}

function naSken(tekst) {
  if (obrada) return;
  obrada = true;
  zaustaviKameru();
  if (navigator.vibrate) navigator.vibrate(80);
  obradiKod(tekst);
}

function traziRucno() {
  const v = $('barkodRucno').value.trim();
  if (!v || obrada) return;
  obrada = true;
  zaustaviKameru();
  obradiKod(v);
}

// ---------- 2D kod (GS1 DataMatrix): GTIN, rok, serija ----------
function gs1(t) {
  const s = String(t).replace(/^\](d2|C1|Q3)/, '');
  if (!/^01\d{14}/.test(s)) return null;
  const r = {};
  let i = 0;
  while (i < s.length) {
    if (s[i] === '\x1d') { i++; continue; }
    const ai = s.substr(i, 2);
    if (ai === '01') { r.gtin = s.substr(i + 2, 14); i += 16; }
    else if (ai === '17') { r.rok = s.substr(i + 2, 6); i += 8; }
    else if (ai === '11' || ai === '15') { i += 8; }
    else if (ai === '10' || ai === '21') {
      let j = s.indexOf('\x1d', i + 2);
      if (j < 0) j = s.length;
      if (ai === '10') r.serija = s.substring(i + 2, j);
      i = j;
    }
    else break;
  }
  return r.gtin ? r : null;
}

function obradiKod(tekst) {
  const g = gs1(tekst);
  let bk = String(tekst).trim();
  const dm = { rok: '', serija: '' };
  if (g) {
    bk = g.gtin.replace(/^0/, '');
    if (g.rok) dm.rok = g.rok.substr(2, 2) + '/20' + g.rok.substr(0, 2);
    dm.serija = g.serija || '';
  }
  traziBarkod(bk, dm);
}

// ---------- šifarnik na telefonu ----------
const SIF_SATI = 12;     // posle koliko sati se šifarnik osvežava
let mapa = null;         // barkod -> [ID, ...]
let nazivi = null;       // ID -> naziv

function kljucB(s) { return String(s == null ? '' : s).replace(/\s/g, '').replace(/^0+/, ''); }

function napraviMapu(s) {
  nazivi = s.nazivi;
  mapa = new Map();
  s.barkodovi.forEach(par => {
    const k = par[0], id = par[1];
    if (!mapa.has(k)) mapa.set(k, []);
    const l = mapa.get(k);
    if (l.indexOf(id) < 0) l.push(id);
  });
  $('sifStatus').textContent = 'Šifarnik: ' + Object.keys(nazivi).length.toLocaleString('sr-RS') +
    ' artikala · ' + new Date(s.vreme).toLocaleString('sr-RS', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

async function ucitajSifarnik(prisilno) {
  if (!prisilno) {
    try {
      const t = localStorage.getItem('sr_sifarnik');
      if (t) {
        const s = JSON.parse(t);
        napraviMapu(s);
        if (Date.now() - s.vreme < SIF_SATI * 3600 * 1000) return;   // dovoljno svež
      }
    } catch (e) {}
  }
  const stari = $('sifStatus').textContent;
  $('sifStatus').textContent = '⏳ Preuzimam šifarnik...';
  try {
    const s = await pozovi({ akcija: 'sifarnik' });
    if (!s.ok) throw new Error(s.greska);
    napraviMapu(s);
    try { localStorage.setItem('sr_sifarnik', JSON.stringify(s)); } catch (e) {}
    if (prisilno) poruka('✔ Šifarnik osvežen');
  } catch (e) {
    $('sifStatus').textContent = mapa ? stari : 'Šifarnik nije preuzet – pretraga ide preko tabele.';
    if (prisilno) poruka('Šifarnik nije osvežen. Proveri internet.', 'var(--crv)');
  }
}

// ---------- pretraga barkoda ----------
async function traziBarkod(bk, dm) {
  // 1) odmah, iz šifarnika na telefonu
  if (mapa) {
    const ids = mapa.get(kljucB(bk));
    if (ids && ids.length) {
      prikaziArtikle(ids.map(id => ({ id: id, naziv: nazivi[id] || '' })), String(bk).trim(), dm);
      return;
    }
  }
  // 2) nema ga na telefonu (možda nov artikal) – pitaj tabelu
  $('ekSken').classList.add('ucitava');
  try {
    const o = await pozovi({ akcija: 'barkod', barkod: bk });
    if (!o.ok) {
      poruka(o.greska, 'var(--crv)');
      $('barkodRucno').value = '';
      pokreniKameru();
      return;
    }
    prikaziArtikle(o.artikli, o.barkod, dm);
  } catch (e) {
    poruka('Nema veze sa tabelom. Proveri internet.', 'var(--crv)');
    pokreniKameru();
  } finally {
    $('ekSken').classList.remove('ucitava');
  }
}

function prikaziArtikle(artikli, bk, dm) {
  ocistiFormu();
  pokazi('ekSken', false);
  pokazi('ekArtikal', true);

  if (dm.rok) {
    $('rok').value = dm.rok;
    proveriRok();
    prikaziInfo('Rok pročitan iz 2D koda – proveri.', 'info');
  }

  if (artikli.length === 1) {
    izaberi(artikli[0], bk);
  } else {
    pokazi('izabran', false);
    $('izbor').innerHTML = '<div class="sitno">Ovaj barkod ima više artikala. Izaberi pravi:</div>';
    artikli.forEach(a => {
      const b = document.createElement('button');
      b.textContent = a.naziv + '  (ID ' + a.id + ')';
      b.onclick = () => izaberi(a, bk);
      $('izbor').appendChild(b);
    });
  }
}

function izaberi(a, bk) {
  trenutni = { id: a.id, naziv: a.naziv, barkod: bk };
  $('izbor').innerHTML = '';
  pokazi('izabran', true);
  $('nazivA').textContent = a.naziv;
  $('idA').textContent = a.id;
  $('bkA').textContent = bk;
}

function ocistiFormu() {
  trenutni = null;
  $('rok').value = '';
  $('serija').value = '';
  serijaRucno = false;
  $('upozRok').className = 'upoz';
  $('izbor').innerHTML = '';
  sakrijInfo();
}

// ---------- slikanje roka ----------
function slikaj() {
  $('foto').value = '';
  $('foto').click();
}

$('foto').addEventListener('change', async () => {
  const f = $('foto').files[0];
  if (!f) return;
  prikaziInfo('⏳ Čitam rok sa slike...', 'info');
  $('ekArtikal').classList.add('ucitava');
  try {
    const t0 = Date.now();
    const b64 = await smanji(f);
    const o = await pozovi({ akcija: 'procitaj', slika: b64, tip: 'image/jpeg', model: $('model').value });
    const ukupno = ((Date.now() - t0) / 1000).toFixed(1).replace('.', ',');
    if (!o.ok) { prikaziInfo(o.greska + '  (⏱ ' + ukupno + ' s)', 'crveno'); return; }
    if (o.rok) { $('rok').value = o.rok; proveriRok(); }
    const vreme = '⏱ Gemini ' + (o.msGemini / 1000).toFixed(1).replace('.', ',') + ' s · ukupno ' + ukupno +
                  ' s · ' + String(o.model || '').replace('gemini-', '');
    if (!o.rok) prikaziInfo('Rok nije pročitan. Slikaj bliže ili ga ukucaj.\n' + vreme, 'narand');
    else prikaziInfo('Na kutiji: ' + (o.procitano || o.rok) + ' – proveri pre čuvanja.\n' + vreme, 'info');
  } catch (e) {
    prikaziInfo('Greška pri slanju slike. Probaj ponovo.', 'crveno');
  } finally {
    $('ekArtikal').classList.remove('ucitava');
  }
});

// Smanjuje sliku pre slanja (brže, manje podataka)
function smanji(f) {
  return new Promise((res, rej) => {
    const img = new Image();
    const u = URL.createObjectURL(f);
    img.onload = () => {
      const max = 1024;
      let w = img.naturalWidth, h = img.naturalHeight;
      const k = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(u);
      res(c.toDataURL('image/jpeg', 0.8).split(',')[1]);
    };
    img.onerror = rej;
    img.src = u;
  });
}

// ---------- rok ----------
// Kucanje: 0328 -> 03/28 ... pri čuvanju 03/2028
$('rok').addEventListener('input', () => {
  const d = $('rok').value.replace(/\D/g, '').slice(0, 6);
  $('rok').value = d.length > 2 ? d.slice(0, 2) + '/' + d.slice(2) : d;
  proveriRok();
});

function normRok(v, konacno) {
  const d = String(v).replace(/\D/g, '');
  let mm, g;
  if (d.length === 4) {
    if (d.slice(2) === '20' && !konacno) return null;   // verovatno se kuca 2028...
    mm = d.slice(0, 2); g = '20' + d.slice(2);
  } else if (d.length === 6) {
    mm = d.slice(0, 2); g = d.slice(2);
  } else return null;
  return { tekst: mm + '/' + g, mm: +mm, g: +g };
}

function proveriRok(konacno) {
  const u = $('upozRok');
  const n = normRok($('rok').value, konacno);
  if (!n) { u.className = 'upoz'; return null; }
  if (n.mm < 1 || n.mm > 12) {
    u.className = 'upoz crveno'; u.textContent = 'Mesec mora biti od 01 do 12.'; return null;
  }
  const sad = new Date();
  const razlika = (n.g * 12 + n.mm) - (sad.getFullYear() * 12 + sad.getMonth() + 1);
  n.istekao = razlika < 0;
  if (razlika < 0) { u.className = 'upoz crveno'; u.textContent = '⛔ Rok je istekao!'; }
  else if (razlika === 0) { u.className = 'upoz narand'; u.textContent = '⚠ Rok ističe ovog meseca.'; }
  else if (razlika < 6) { u.className = 'upoz narand'; u.textContent = '⚠ Kratak rok – ističe za ' + razlika + ' mes.'; }
  else u.className = 'upoz';
  if (!serijaRucno) $('serija').value = serijaIzRoka(n);
  return n;
}

// Serija = rok rečima, npr. 03/2027 -> MART 2027
const MESECI = ['JANUAR', 'FEBRUAR', 'MART', 'APRIL', 'MAJ', 'JUN', 'JUL',
                'AVGUST', 'SEPTEMBAR', 'OKTOBAR', 'NOVEMBAR', 'DECEMBAR'];
let serijaRucno = false;   // true kad zaposleni sam prepravi seriju
function serijaIzRoka(n) { return MESECI[n.mm - 1] + ' ' + n.g; }

$('serija').addEventListener('input', () => { serijaRucno = $('serija').value.trim() !== ''; });

// ---------- čuvanje ----------
async function sacuvaj() {
  if (!trenutni) { poruka('Izaberi artikal.', 'var(--crv)'); return; }
  const n = proveriRok(true);
  if (!n) { poruka('Upiši ispravan rok (npr. 0328).', 'var(--crv)'); $('rok').focus(); return; }
  if (n.istekao && !confirm('Rok je istekao. Da li ipak da sačuvam?')) return;

  const podaci = {
    akcija: 'upisi',
    barkod: trenutni.barkod,
    id: trenutni.id,
    naziv: trenutni.naziv,
    serija: $('serija').value.trim() || serijaIzRoka(n),
    rok: n.tekst,
    apoteka: apoteka
  };

  $('ekArtikal').classList.add('ucitava');
  try {
    const o = await pozovi(podaci);
    if (!o.ok) { poruka(o.greska, 'var(--crv)'); return; }
    poruka('✔ Sačuvano');
    unosi.unshift({ naziv: podaci.naziv, rok: podaci.rok, serija: podaci.serija,
                    vreme: new Date().toLocaleTimeString('sr-RS', { hour: '2-digit', minute: '2-digit' }) });
    prikaziListu();
    nazad();
  } catch (e) {
    poruka('Nije sačuvano – nema veze. Probaj ponovo.', 'var(--crv)');
  } finally {
    $('ekArtikal').classList.remove('ucitava');
  }
}

function prikaziListu() {
  const ul = $('lista');
  ul.innerHTML = '';
  unosi.slice(0, 15).forEach(x => {
    const li = document.createElement('li');
    const b = document.createElement('b');
    b.textContent = x.rok;
    li.appendChild(b);
    li.appendChild(document.createTextNode('  ' + x.naziv + (x.serija ? ' · ser. ' + x.serija : '') + ' · ' + x.vreme));
    ul.appendChild(li);
  });
}

function nazad() {
  ocistiFormu();
  pokazi('ekArtikal', false);
  pokazi('ekSken', true);
  $('barkodRucno').value = '';
  pokreniKameru();
}

// ---------- start ----------
$('barkodRucno').addEventListener('keydown', e => { if (e.key === 'Enter') traziRucno(); });

APOTEKE.forEach(a => {
  const o = document.createElement('option');
  o.value = a; o.textContent = a;
  $('izborApoteke').appendChild(o);
});

ucitajSifarnik(false);

// zapamćen izbor modela
try { const m = localStorage.getItem('sr_model'); if (m) $('model').value = m; } catch (e) {}
$('model').addEventListener('change', () => { try { localStorage.setItem('sr_model', $('model').value); } catch (e) {} });

apoteka = citajApoteku();
if (!apoteka) {
  pokazi('ekApoteka', true);
} else {
  $('apotekaOzn').textContent = apoteka;
  pokazi('ekSken', true);
  pokreniKameru();
}
</script>
</body>
</html>
